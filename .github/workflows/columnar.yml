name: Columnar native restore

on:
  pull_request:
    paths:
      - 'Dockerfile.postgres-columnar'
      - 'patches/**'
      - 'docker-compose.columnar.yml'
      - 'storage/backup*.py'
      - 'storage/columnar*.py'
      - 'tests/test_columnar*.py'
      - 'storage/db/archive*.py'
      - 'storage/db/postgres.py'
      - 'storage/db/history_queries.py'
      - 'storage/db/retention_executor.py'
      - 'storage/db/storage_report.py'
      - 'config.py'
      - 'scripts/sample_columnar_history.py'
      - 'scripts/migrate-*.sh'
      - 'scripts/compact_mqtt_partitions.py'
      - 'tests/test_legacy_storage*.py'
      - 'tests/test_archive*.py'
      - 'tests/test_history_queries*.py'
      - 'scripts/benchmark_history_read_plans.py'
      - 'scripts/restore_database.py'
      - 'scripts/verify_columnar_backup_restore.py'
      - 'scripts/verify_columnar_planner_costs.py'
      - '.github/workflows/columnar.yml'
  push:
    paths:
      - 'Dockerfile.postgres-columnar'
      - 'patches/**'
      - 'docker-compose.columnar.yml'
      - 'storage/backup*.py'
      - 'storage/columnar*.py'
      - 'tests/test_columnar*.py'
      - 'storage/db/archive*.py'
      - 'storage/db/postgres.py'
      - 'storage/db/history_queries.py'
      - 'storage/db/retention_executor.py'
      - 'storage/db/storage_report.py'
      - 'config.py'
      - 'scripts/sample_columnar_history.py'
      - 'scripts/migrate-*.sh'
      - 'scripts/compact_mqtt_partitions.py'
      - 'tests/test_legacy_storage*.py'
      - 'tests/test_archive*.py'
      - 'tests/test_history_queries*.py'
      - 'scripts/benchmark_history_read_plans.py'
      - 'scripts/restore_database.py'
      - 'scripts/verify_columnar_backup_restore.py'
      - 'scripts/verify_columnar_planner_costs.py'
      - '.github/workflows/columnar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-restore:
    name: PostgreSQL 18.6 / Citus 14.1 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image on its native architecture
        run: |
          set +e
          docker build --progress=plain --build-arg COLUMNAR_BUILD_JOBS=2 --file Dockerfile.postgres-columnar --tag columnar-native-ci . 2>&1 | tee "$RUNNER_TEMP/columnar-build.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            # Public check annotations remain readable without access to GitHub's
            # authenticated log-download API. This build has no secret inputs.
            python3 - "$RUNNER_TEMP/columnar-build.log" <<'PYCODE'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          failures = [i for i, line in enumerate(lines) if re.search(r'(fatal error:|error:|No rule to make|undefined reference|E: Unable|E: Version)', line, re.I)]
          excerpts = ['\n'.join(lines[max(0, i-2):i+4]) for i in failures[:8]] or ['\n'.join(lines[-20:])]
          for number, detail in enumerate(excerpts):
              detail = detail[:3500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Native Columnar image build {number+1}::' + detail)
          PYCODE
            exit "$result"
          fi
      - name: Build the unpatched baseline from the same compiled source stage
        run: |
          docker build --progress=plain --build-arg COLUMNAR_BUILD_JOBS=2 \
            --file Dockerfile.postgres-columnar --target unpatched \
            --tag columnar-unpatched-native-ci .
          test "$(docker image inspect --format '{{.Architecture}}' columnar-unpatched-native-ci)" = '${{ matrix.arch }}'
          test "$(docker image inspect --format '{{index .Config.Labels "io.meshinfo.columnar.planner-patch"}}' columnar-native-ci)" = planner-costing-v2
          test "$(docker image inspect --format '{{index .Config.Labels "io.meshinfo.columnar.planner-patch"}}' columnar-unpatched-native-ci)" = none
      - name: Start an isolated test cluster without published ports
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' columnar-native-ci)" = '${{ matrix.arch }}'
          docker network create columnar-native-ci
          docker run -d --name columnar-native-ci --network columnar-native-ci \
            --memory 768m --cpus 2 --shm-size 128m \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e PGUSER=postgres \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/work,readonly \
            columnar-native-ci postgres -c shared_preload_libraries=citus_columnar \
            -c shared_buffers=64MB -c max_connections=20
          for attempt in $(seq 1 60); do
            # The entrypoint's temporary init server accepts socket connections
            # before restarting; TCP readiness selects the final server.
            if docker exec columnar-native-ci pg_isready -h 127.0.0.1 -U postgres -q; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Add minimal test dependencies to the disposable container
        run: |
          docker exec -u 0 columnar-native-ci sh -c \
            'apt-get update && apt-get install -y --no-install-recommends python3 python3-asyncpg python3-pytest python3-requests && rm -rf /var/lib/apt/lists/*'
      - name: Compare native planner costs and results with the unpatched release
        run: |
          docker exec columnar-native-ci createdb -U postgres meshinfo_planner_test
          docker exec columnar-native-ci psql -U postgres -d meshinfo_planner_test \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION citus_columnar;'
          docker run -d --name columnar-unpatched-native-ci --network columnar-native-ci \
            --label io.meshinfo.archive-test=true --memory 768m --cpus 2 --shm-size 128m \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=meshinfo_planner_test \
            columnar-unpatched-native-ci postgres -c shared_preload_libraries=citus_columnar \
            -c shared_buffers=64MB -c max_connections=20
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec columnar-unpatched-native-ci pg_isready -h 127.0.0.1 -U postgres -q; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker exec columnar-unpatched-native-ci psql -U postgres -d meshinfo_planner_test \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION citus_columnar;'
          docker exec -w /work columnar-native-ci python3 -m pytest -q -p no:cacheprovider \
            tests/test_columnar_planner_costs.py
          set +e
          docker exec -w /work \
            -e MESHINFO_PLANNER_BASELINE_DSN=postgresql://postgres@columnar-unpatched-native-ci:5432/meshinfo_planner_test \
            -e MESHINFO_PLANNER_PATCHED_DSN=postgresql://postgres@127.0.0.1:5432/meshinfo_planner_test \
            columnar-native-ci python3 scripts/verify_columnar_planner_costs.py \
            --baseline-dsn-env MESHINFO_PLANNER_BASELINE_DSN \
            --patched-dsn-env MESHINFO_PLANNER_PATCHED_DSN \
            --output /tmp/columnar-planner-costs.json
          result=$?
          set -e
          docker cp columnar-native-ci:/tmp/columnar-planner-costs.json "$RUNNER_TEMP/columnar-planner-costs.json" || true
          exit "$result"
      - name: Preserve the source-free native planner comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: columnar-planner-cost-parity-${{ matrix.arch }}
          path: ${{ runner.temp }}/columnar-planner-costs.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify actual backup, settings before COPY, staging and rollback
        run: |
          docker exec -w /work columnar-native-ci \
            python3 scripts/verify_columnar_backup_restore.py
      - name: Verify checkpoint restore, cancellation, queries and startup indexes
        run: |
          docker exec columnar-native-ci createdb -U postgres native_archive_test
          docker exec -w /work \
            -e MESHINFO_ARCHIVE_TEST_DSN=postgresql://postgres@127.0.0.1:5432/native_archive_test \
            columnar-native-ci python3 -m pytest -q -p no:cacheprovider \
            tests/test_archive_integration.py tests/test_archive_application_integration.py \
            tests/test_archive_analysis.py tests/test_archive_analysis_integration.py \
            tests/test_archive_topics_estimate_integration.py \
            tests/test_archive_copy_ranges_integration.py tests/test_archive_guarded_integration.py \
            tests/test_archive_catalog_integration.py tests/test_archive.py \
            tests/test_archive_catalog.py tests/test_columnar_backup.py tests/test_columnar_copy.py \
            tests/test_legacy_storage_guards.py tests/test_legacy_storage_integration.py
      - name: Verify production history readers on heap and mixed partitions
        run: |
          docker exec columnar-native-ci createdb -U postgres native_columnar_test
          docker exec columnar-native-ci psql -U postgres -d native_columnar_test \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION citus_columnar; CREATE EXTENSION pg_trgm;'
          docker exec -w /work \
            -e MESHINFO_HISTORY_TEST_DSN=postgresql://postgres@127.0.0.1:5432/native_columnar_test \
            columnar-native-ci python3 -m pytest -q -p no:cacheprovider \
            tests/test_history_queries.py tests/test_history_queries_integration.py \
            tests/test_history_candidates_integration.py tests/test_history_queries_nodes_integration.py
      - name: Verify packet details and node pages without Columnar loaded or installed
        run: |
          # Reuse the built image but override its preload default. No extension
          # is created in this separate database; the tests assert both facts.
          docker run -d --name columnar-plain-native-ci --network columnar-native-ci \
            --label io.meshinfo.archive-test=true --memory 128m --cpus 0.5 --shm-size 16m \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=native_plain_reader_test \
            columnar-native-ci postgres -c shared_preload_libraries= \
            -c shared_buffers=8MB -c work_mem=1MB -c maintenance_work_mem=8MB \
            -c max_connections=10 -c max_parallel_workers=0 -c wal_buffers=1MB \
            -c max_wal_size=64MB -c min_wal_size=32MB
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec columnar-plain-native-ci pg_isready -h 127.0.0.1 -U postgres -q; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          # Python dependencies already exist in the first test container.
          docker exec -i columnar-native-ci python3 - <<'PYCODE'
          import json, os
          path = '/tmp/plain-history-connection.json'
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w') as stream:
              json.dump({'host': 'columnar-plain-native-ci', 'user': 'postgres',
                         'database': 'native_plain_reader_test'}, stream)
          PYCODE
          docker exec -w /work \
            -e MESHINFO_PLAIN_HISTORY_TEST_CONNECTION=/tmp/plain-history-connection.json \
            columnar-native-ci python3 -m pytest -q -p no:cacheprovider \
            tests/test_history_queries_plain_integration.py
      - name: Remove the isolated cluster and anonymous data volume
        if: always()
        run: |
          docker rm -fv columnar-unpatched-native-ci columnar-plain-native-ci columnar-native-ci || true
          docker network rm columnar-native-ci || true

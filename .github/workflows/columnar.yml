name: Columnar native restore

on:
  pull_request:
    paths:
      - 'Dockerfile.postgres-columnar'
      - 'docker-compose.columnar.yml'
      - 'storage/backup*.py'
      - 'storage/columnar_backup.py'
      - 'storage/db/archive*.py'
      - 'tests/test_archive*.py'
      - 'scripts/restore_database.py'
      - 'scripts/verify_columnar_backup_restore.py'
      - '.github/workflows/columnar.yml'
  push:
    paths:
      - 'Dockerfile.postgres-columnar'
      - 'docker-compose.columnar.yml'
      - 'storage/backup*.py'
      - 'storage/columnar_backup.py'
      - 'storage/db/archive*.py'
      - 'tests/test_archive*.py'
      - 'scripts/restore_database.py'
      - 'scripts/verify_columnar_backup_restore.py'
      - '.github/workflows/columnar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-restore:
    name: PostgreSQL 18.6 / Citus 14.1 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image on its native architecture
        run: docker build --file Dockerfile.postgres-columnar --tag columnar-native-ci .
      - name: Start an isolated test cluster without published ports
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' columnar-native-ci)" = '${{ matrix.arch }}'
          docker network create columnar-native-ci
          docker run -d --name columnar-native-ci --network columnar-native-ci \
            --memory 768m --cpus 2 --shm-size 128m \
            -e POSTGRES_HOST_AUTH_METHOD=trust -e PGUSER=postgres \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/work,readonly \
            columnar-native-ci postgres -c shared_preload_libraries=citus_columnar \
            -c shared_buffers=64MB -c max_connections=20
          for attempt in $(seq 1 60); do
            if docker exec columnar-native-ci pg_isready -U postgres -q; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Add only the test interpreter to the disposable container
        run: |
          docker exec -u 0 columnar-native-ci sh -c \
            'apt-get update && apt-get install -y --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*'
      - name: Verify actual backup, settings before COPY, staging and rollback
        run: |
          docker exec -w /work columnar-native-ci \
            python3 scripts/verify_columnar_backup_restore.py
      - name: Remove the isolated cluster and anonymous data volume
        if: always()
        run: |
          docker rm -fv columnar-native-ci || true
          docker network rm columnar-native-ci || true
